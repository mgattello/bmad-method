# Server block only; installed as /etc/nginx/conf.d/default.conf (AD-9, AD-13).
server {
    listen 8080;
    root /usr/share/nginx/html;

    # Server-level headers; locations must not add their own or they stop inheriting these.
    add_header X-Content-Type-Options nosniff always;
    add_header Content-Security-Policy "default-src 'self'" always;

    location = /healthz {
        default_type text/plain;
        return 200 'ok';
    }

    # Path passed through unchanged: no trailing slash, no rewrite.
    location /api/ {
        proxy_pass http://api:3000;
        proxy_http_version 1.1;
        proxy_intercept_errors off;
        proxy_set_header Host $host;
    }

    # A missing hashed bundle is a 404, never index.html.
    location /assets/ {
        try_files $uri =404;
    }

    location / {
        try_files $uri /index.html;
    }
}
